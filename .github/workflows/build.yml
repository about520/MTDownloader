name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: 编译并打包 IPA
    runs-on: macos-15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 查看 Xcode 环境
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: 诊断工作区
        run: |
          pwd
          echo "--- 顶层 ---"
          ls -la
          echo "--- swift 文件 ---"
          find . -name "*.swift" -not -path "./.git/*"
          echo "--- MTDownloader 目录 ---"
          ls -la MTDownloader || echo "!! MTDownloader 目录不存在"

      - name: 安装 xcodegen
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          fi
          xcodegen --version

      - name: 生成 Xcode 工程
        run: xcodegen generate

      - name: 编译（Release，免签名）
        run: |
          xcodebuild \
            -project MTDownloader.xcodeproj \
            -scheme MTDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: 打包成 IPA
        run: |
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" -print -quit)
          if [ -z "$APP" ]; then
            echo "::error::没找到编译产物 .app"
            exit 1
          fi
          echo "找到产物: $APP"
          rm -rf Payload
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry MTDownloader.ipa Payload
          ls -lh MTDownloader.ipa

      - name: 上传 IPA 产物
        uses: actions/upload-artifact@v4
        with:
          name: MTDownloader-IPA
          path: MTDownloader.ipa
          if-no-files-found: error
