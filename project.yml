name: MTDownloader

options:
  bundleIdPrefix: com.mtdownloader
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 1 = iPhone, 2 = iPad，两个家族都支持，iPad 上才能以平板原生分辨率跑
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_BITCODE: "NO"
    # 启动屏用 Info.plist 里的 UILaunchScreen 字典声明（Xcode 15+ 官方模板做法），
    # 不再依赖 LaunchScreen.storyboard 文件 —— 文件没打进包会导致启动崩溃。
    # 有启动屏声明，iOS 才会按设备原生分辨率渲染；否则判定「未适配新机型」，
    # 退回兼容缩放模式（画面被拉伸、上下黑边）。

targets:
  MTDownloader:
    type: application
    platform: iOS
    sources:
      - path: MTDownloader/MTDownloaderApp.swift
      - path: MTDownloader/ContentView.swift
      - path: MTDownloader/DeviceInfo.swift
      - path: MTDownloader/DownloadManager.swift
      - path: MTDownloader/ChunkDownloader.swift
      - path: MTDownloader/FilesView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mtdownloader.app
        PRODUCT_NAME: MTDownloader
    info:
      path: MTDownloader/Info.plist
      properties:
        CFBundleDisplayName: 多线程下载器
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "2"
        LSApplicationCategoryType: "public.app-category.utilities"
        UIFileSharingEnabled: true
        # Xcode 15+ 官方模板同款：用字典声明启动屏，不需要 storyboard 文件。
        # 有这一项，iOS 才认定 App 适配了新机型，按原生分辨率渲染。
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiredDeviceCapabilities:
          - arm64
        # 竖屏 + 横屏 + iPad 全向，转到横屏时按横屏分辨率重排，不会拉伸
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
